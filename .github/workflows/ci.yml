name: CI

# UNIT TESTS ONLY, DELIBERATELY.
#
# The 48 integration checks need a SQL Server, sibling apps installed into the same workspace, an MJ
# core migration and a metadata push. That is a local development environment, not a CI runner.
# Adapted from bizapps-orders' CI, which reached the same conclusion the hard way.
#
# The division of labour is explicit:
#
#   HERE          69 tests, no environment, seconds: the contract draft's validation (which sections
#                 and fields an incomplete agreement reports), the workspace tab state machine
#                 (needs-attention / available / not-yet and the precondition behind each), and the
#                 REGISTRY PARITY floor — which bundles exist and how many checks each holds, so a
#                 suite that silently shrinks fails here rather than passing with less in it.
#
#   BEFORE MERGE  everything that touches a database or a browser, run locally:
#
#                     npm run verify                                   # the lot, in order, with the
#                                                                      # integration tally CHECKED
#                     node test-harnesses/integration.mjs              # 48, each rolled back
#                     npx tsx test-harnesses/server/{invariants,lifecycle,constraints}.ts   # 103
#                     npx tsx test-harnesses/erd-schema-diff.ts        # 45, ERD vs sys.columns
#                     node test-harnesses/ui-workspace.mjs "$URL"      # 96, real Chrome
#                     node test-harnesses/ui-layout.mjs "$URL"         # 179, every page x 3 sizes
#
# 526 assertions in total, of which CI can honestly run 55. The browser suites found three defects
# that a passing back-end suite did not: a contract that could not be opened, a tab gated on the
# wrong precondition, and a page whose layout depended on the window height. None of those is
# reachable from a hosted runner, and a red X everyone learns to ignore is worse than a documented
# manual step.
#
# UNLIKE ORDERS, there is no RUN_MUTATION_TESTS flag here — contracts' checks are not declared
# `RequiresMutation`, and this repo's runner does not read that variable. Do not copy that step in
# from orders without first making it true.

on:
  pull_request:
  push:
    branches: [next]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # NODE 24, TO MATCH THE npm MAJOR THAT WROTE THE LOCKFILE.
      #
      # This said '22' and every run died before a single test at `npm ci`:
      #
      #     `npm ci` can only install packages when your package.json and package-lock.json
      #     are in sync.  Missing: chokidar@3.6.0 from lock file
      #
      # The lockfile is NOT stale — regenerating it with npm 11 produces a zero-line diff. It is an
      # npm MAJOR disagreement. Seven copies of `nunjucks@3.2.4` (via the MJ CLI and server) want
      # `chokidar@^3.3.0`; `@angular/compiler-cli` pulls `chokidar@5`. npm 11 hoists the 5 and marks
      # the nunjucks edges invalid; npm 10 refuses and demands nested `chokidar@3.6.0` entries the
      # lock does not carry. Node 22 ships npm 10, so `npm ci` failed there and nowhere else.
      #
      # 24 is also what `build.yml` and `pg-migrations.yml` already use, and what the app is
      # developed on — this workflow was the only one out of step. Reproduced in a clean clone:
      # `npm ci` passes on npm 11 and fails on npm 10 with exactly the error above. If the lockfile
      # is ever regenerated by npm 10, revisit this rather than pinning the runner lower.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # `id` + `outcome`, because everything below asks whether THIS step got far enough to make the
      # next one meaningful. Without it a failed install skips the build and the test steps silently,
      # and the summary blames the build for a failure that happened before it — which is exactly
      # what happened here on 2026-08-07.
      - name: Install dependencies
        id: install
        run: npm ci

      # BUILD BEFORE TESTING, AND KEEP GOING PAST WHAT CANNOT COMPILE.
      #
      # `@mj-biz-apps/contracts-ng` does not compile on a runner: it peer-depends on
      # `@mj-biz-apps/accounting-ng`, which is UNPUBLISHED — it exists locally only because the mjdev
      # dev-link puts accounting in the same npm workspace. The peer is marked optional so `npm ci`
      # resolves, but the compile still cannot find it.
      #
      # A plain `build:packages` would abort on that package and the tests would never run, which is
      # the worst shape a check can have: a red X that reads like a known failure but is really the
      # tests not executing. So the build continues, the tests run and report, and the job is failed
      # deliberately at the end. Nothing is downgraded to a warning — the check stays RED, and it
      # goes green by itself the day accounting publishes, with nothing to remember to revert.
      #
      # Expected today: 5 of 6 packages build. The unit tests live in contracts-ng and run anyway,
      # because vitest compiles the TypeScript itself and the specs import no accounting code.
      - name: Build app packages
        id: build
        if: always() && steps.install.outcome == 'success'
        run: |
          if npm run build:packages -- --continue; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            echo "::error title=Build failed::One or more @mj-biz-apps/contracts-* packages did not compile. Unit tests below ran against whatever did build."
          fi

      # INCLUDES THE ANTI-VACUITY FLOOR. `registry-parity.test.ts` asserts the integration registry's
      # exact shape — which bundles exist, how many checks each holds, that every id is unique and
      # namespaced — so a bundle silently dropping out of the suite fails HERE, on a runner, without
      # a database. That is the one part of the integration tier CI can honestly police, and it is
      # the part that catches a suite quietly shrinking. Its twin, `scripts/assert-check-count.mjs`,
      # guards the other half locally: that a real RUN executed that many.
      #
      # `npm run test:unit` fans out through turbo to both packages that have tests (contracts-ng's
      # 55 logic tests and IntegrationTests' 7 parity tests), rather than naming one directory and
      # silently missing any suite added later.
      # RUNS EVEN WHEN THE BUILD FAILED — and now says so in the workflow rather than relying on it.
      #
      # The build step swallows its own non-zero exit inside an `if/else`, so it has always been
      # possible for the tests to run after a failed compile, and they do: vitest transpiles the
      # TypeScript itself, and the specs import no accounting code. But that survival was an
      # accident of how the step is written — any future edit that lets the build step exit non-zero
      # (a `set -e`, a failed `>> $GITHUB_OUTPUT`, a `continue-on-error` removal) would silently
      # skip the tests, and a skipped test step reports identically to a failed one.
      #
      # `always()` states the intent directly. The `install` guard is the other half: with no
      # `node_modules` there is nothing to test, so a failed install skips this honestly instead of
      # producing a second, misleading error on top of the first.
      - name: Unit tests
        id: unit
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          if npm run test:unit 2>&1 | tee /tmp/vitest.log; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi

      # The run's landing page, so the tally is readable without expanding a log. When the build has
      # broken, the collapsed view of a failing job shows only the LAST failing step, which would
      # otherwise bury the thing you actually came to read.
      - name: Summary
        if: always()
        run: |
          {
            echo '## Contracts CI'
            echo
            echo '| gate | result |'
            echo '| --- | --- |'
            # INSTALL GETS ITS OWN ROW because it is the one failure that makes every row below it
            # meaningless. When `npm ci` died, this table said "Build ❌" and "Unit tests ⚠️ did not
            # run" — both technically true, and together they read as the known unpublished-peer
            # failure. Nothing had installed. A row that names the real first failure is the
            # difference between a check people read and one they pattern-match.
            if [ '${{ steps.install.outcome }}' = 'success' ]; then
              echo '| Install (`npm ci`) | ✅ passed |'
            else
              echo '| Install (`npm ci`) | ❌ FAILED — nothing below ran |'
            fi
            if [ "${{ steps.build.outputs.ok }}" = 'true' ]; then
              echo '| Build (`build:packages`) | ✅ passed |'
            elif [ '${{ steps.install.outcome }}' != 'success' ]; then
              echo '| Build (`build:packages`) | ⏭ skipped — install failed |'
            else
              echo '| Build (`build:packages`) | ❌ failed — see the Build step |'
            fi
            if [ -f /tmp/vitest.log ]; then
              # Strip the colour escapes first — vitest colourises on an Actions runner, and the codes
              # sit BEFORE the leading whitespace, so an anchored grep silently matches nothing and the
              # tally quietly degrades to "see log". Verified against a real run's output.
              CLEAN=$(perl -pe 's/\e\[[0-9;]*m//g' /tmp/vitest.log)
              # `|| true` because the step runs under `bash -e`: a grep that matches nothing would
              # otherwise abort the step mid-summary rather than fall through to "see log".
              FILES=$(printf '%s\n' "$CLEAN" | grep -E '^[[:space:]]*Test Files[[:space:]]' | tail -1 | sed -E 's/^[[:space:]]*Test Files[[:space:]]+//') || true
              TESTS=$(printf '%s\n' "$CLEAN" | grep -E '^[[:space:]]*Tests[[:space:]]' | tail -1 | sed -E 's/^[[:space:]]*Tests[[:space:]]+//') || true
              if [ "${{ steps.unit.outputs.ok }}" = 'true' ]; then
                echo "| Unit tests | ✅ ${TESTS:-see log} |"
              else
                echo "| Unit tests | ❌ ${TESTS:-see log} |"
              fi
              echo
              echo "Test files: ${FILES:-see log}"
            else
              echo '| Unit tests | ⚠️ did not run |'
            fi
            # SCOPED to a build that actually ran. Printed unconditionally it would explain away an
            # install failure as the known-expected one, which is how a genuinely different break
            # hides behind a familiar red X.
            if [ '${{ steps.install.outcome }}' = 'success' ] && [ "${{ steps.build.outputs.ok }}" != 'true' ]; then
              echo
              echo '> The build failure is expected, and it takes TWO publishes to clear, not one:'
              echo '> `@mj-biz-apps/accounting-ng` is unpublished (`TS2307`, plus two `TS7006`'
              echo '> downstream of it), and MJ`s published `ng-ui-components` has no'
              echo '> `TabConfig.disabled` / `disabledReason` (three `TS2339`). The unit tests below'
              echo '> still ran — vitest transpiles its own TypeScript — so a lower count here would'
              echo '> be a regression, not a consequence. See `.github/workflows/ci.yml`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Advisory, not a gate. `migrations/_README.md` requires a changeset on any PR touching a
      # migration, and that rule sat unenforced through several schema changes. A warning annotation
      # is honest about what this is — a reminder in review — rather than a red X on documentation
      # PRs that legitimately have no version impact.
      - name: Changeset present?
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md' -print -quit)" ]; then
            echo "::warning title=No changeset::This PR carries no changeset. One is required for any change to migrations/ or a published package — run 'npx changeset'."
          fi

      - name: State plainly what this gate does not cover
        if: always()
        run: |
          echo "::notice title=Integration checks are not run here::464 of this repo's 533 assertions need a database or a browser and cannot run here. Run 'npm run verify' before merging, then the two browser suites — see the top of .github/workflows/ci.yml."

      # THE GATE, and it is last on purpose. Failing earlier would skip every step above that is not
      # marked `always()` — including the changeset reminder — and, more importantly, would collapse
      # the job onto the build error again. Everything before this reports; this decides.
      # `install` is listed explicitly even though a failed install already leaves `build.outputs.ok`
      # empty and would fail this anyway — stating it means the gate reads as the three things it
      # actually decides on, rather than relying on a side effect of a skipped step.
      - name: Fail if install, build or tests failed
        if: always() && (steps.install.outcome != 'success' || steps.build.outputs.ok != 'true' || steps.unit.outputs.ok != 'true')
        run: exit 1
