name: Build All Packages

on:
  workflow_dispatch:
  push:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      # package.json affects resolution (overrides, deps), like pnpm-workspace.yaml.
      - 'package.json'
      # Every package tsconfig extends a root tsconfig, and turbo.json defines the
      # build graph and its hashing: both change build output.
      - 'tsconfig.*.json'
      - 'turbo.json'
      # The guards over vwContracts read migrations/ — a migration-only change is
      # EXACTLY the shape of #59, which reverted issue #28 item 16. Without this the
      # unit step below cannot run on the change it most needs to see.
      - 'migrations/**'
      # The root vitest config decides which test files the unit step collects, and
      # tests under packages/ read metadata/ files: either can change test outcomes.
      - 'vitest.config.ts'
      - 'metadata/**'
      # .npmrc sets install behavior (auto-install-peers=false), and the build runs
      # these three check scripts before installing.
      - '.npmrc'
      - '.github/scripts/validate-package-repository.sh'
      - '.github/scripts/validate-package-files.sh'
      - '.github/scripts/check-dependency-model.mjs'
      # ...and on the workflow itself, or a change to this file ships untested.
      - '.github/workflows/build.yml'
  pull_request:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'package.json'
      - 'tsconfig.*.json'
      - 'turbo.json'
      - 'migrations/**'
      - 'vitest.config.ts'
      - 'metadata/**'
      - '.npmrc'
      - '.github/scripts/validate-package-repository.sh'
      - '.github/scripts/validate-package-files.sh'
      - '.github/scripts/check-dependency-model.mjs'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      # A host installs one copy of MemberJunction and of each Open App. @memberjunction/* (or another
      # app's @mj-biz-apps/*) in `dependencies`, or a `~`/exact peer range, gives it a second copy and
      # splits the class-factory registry. Needs only Node.
      - name: Dependency model (MJ and sibling apps are caret peers)
        run: |
          node ./.github/scripts/check-dependency-model.mjs --self-test
          node ./.github/scripts/check-dependency-model.mjs

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      - name: Validate packages restrict what they ship
        run: ./.github/scripts/validate-package-files.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:packages

      # Unit tests. Until this step existed, NO workflow in this repo ran a test —
      # 350 of them, including the guards over vwContracts, were green only on
      # whoever's laptop last ran them. That is how issue #28 item 16 was reverted
      # in #59 and stayed reverted: the test watching it went green against a
      # migration the database no longer runs last, and nothing was executing it
      # anyway.
      #
      # `test:unit` is the ROOT vitest run, not `pnpm test`. The root config's
      # include (packages/*/src/**/*.test.ts) collects all 26 files across
      # CoreEntitiesServer, Entities and IntegrationTests, whereas the turbo `test`
      # task fails on contracts-integration-tests — its per-package vitest finds no
      # files and exits 1. That is tracked separately; it is a developer-facing
      # break in `pnpm test`, not a gap in what CI covers.
      - name: Unit tests
        if: always()
        run: pnpm run test:unit
