name: Build All Packages

on:
  workflow_dispatch:
  push:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
  pull_request:
    # `ready_for_review` is NOT in the default type set (opened/synchronize/reopened),
    # and the job below skips while the PR is a draft — without it, marking a PR ready
    # would not re-trigger anything and the check would never report.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    # Drafts DO fire opened/synchronize, so a draft otherwise burns a full run on every
    # push. Skip while draft; the `ready_for_review` trigger above brings it back. A job
    # skipped by `if:` still reports a conclusion, so this is safe as a required check.
    # The event_name arm keeps the job running on `push`, where pull_request is null.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      - name: Validate packages restrict what they ship
        run: ./.github/scripts/validate-package-files.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:packages
